name: effect-sql-pg-boss-orders

services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: orders
        ports:
            - "54320:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres", "-d", "orders"]
            interval: 1s
            timeout: 5s
            retries: 30
